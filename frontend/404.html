<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="The requested VRAM calculator page could not be found."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Page Not Found | AI Deployment Calculator</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <span class="brand"
          ><span class="brand-mark">~</span>VRAM-calculator</span
        >
        <div class="topstatus">
          <span class="status-item"
            ><span>STATUS</span><strong>404</strong></span
          >
        </div>
      </header>

      <main class="layout">
        <section class="results" aria-labelledby="not-found-title">
          <div class="hero">
            <div class="hero-primary">
              <p class="hero-label">Page not found</p>
              <h1 class="hero-value" id="not-found-title">
                This route is not available.
              </h1>
              <p class="hero-say">
                The calculator is still online, but this URL does not map to a
                current page.
              </p>
            </div>
            <p class="hero-secondary">
              <a href="/">Back to calculator</a>
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>

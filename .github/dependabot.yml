version: 2

# The repo is a single pnpm workspace: one root lockfile covers frontend/ and harness/,
# so one npm entry at "/" is enough. Minor/patch updates are grouped to keep PR volume
# sane; majors stay ungrouped so each gets its own review.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
